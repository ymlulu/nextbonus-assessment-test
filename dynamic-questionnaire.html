<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NextBonus Assessment · 动态问卷试验</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f9fc;color:#182539}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
a{color:#285bb9}h1{margin:.3em 0;font-size:28px}h2{font-size:17px;margin:26px 0 12px}
p{line-height:1.55}.muted{color:#697588}.small{color:#697588;font-size:12px}
.header,.question,.summary,.notes{background:white;border:1px solid #e1e6ee;border-radius:14px;padding:20px;margin-bottom:14px}
.header{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
.header p{margin:4px 0;color:#697588}.badge{background:#eaf1ff;color:#1a50a4;padding:6px 10px;border-radius:20px;font-size:12px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}select,input,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #cdd5e3;background:#fff}
select{min-width:240px;max-width:100%}button{cursor:pointer;background:#1f61c2;color:#fff;border-color:#1f61c2}button.secondary{background:white;color:#27476b;border-color:#cdd5e3}
.question-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.question-head strong{font-size:15px}.question-head span{font-size:11px}
.input-row{display:flex;gap:8px;flex-wrap:wrap}.input-row input{flex:1;min-width:160px}
.summary{background:#f0f5ff}details{margin-top:12px}summary{cursor:pointer}
@media(max-width:560px){.wrap{padding:18px 12px 50px}.header{padding:16px}.question{padding:16px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="header"><div><div class="small"><a href="./">Assessment 独立测试站</a> / 动态问卷</div><h1>动态申请问卷</h1>
    <p>独立问卷生成原型 · 不包含长期福利 Q7 / Q8</p></div><span class="badge">本机运行 · 不上传答案</span></div>
  <div class="controls"><label for="product"><strong>选择信用卡：</strong></label><select id="product"></select>
    <button id="reset" class="secondary" type="button">清空本页答案</button></div>
  <div class="summary"><strong id="summary">正在读取独立评估数据…</strong><p class="small" id="version"></p></div>
  <div id="questions"></div>
  <div class="notes"><strong>原型边界</strong>
    <p class="muted">这版只负责按 129 条规则索引生成需要问的问题。没有完成完整规则执行、没有计算获批可能性，也不会读取或修改 Discover。无法确认的银行条款保持「待核实」，不会向用户猜测。</p>
    <details><summary>查看规则匹配详情</summary><p class="small" id="scope"></p><p class="small" id="gaps"></p></details>
  </div>
</main>
<script src="adapters/dynamic-questionnaire-v1.js"></script>
<script src="assets/dynamic-questionnaire-demo.js"></script>
</body>
</html>
