name: Phase 3 Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/data-driven-assessment-phase3]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Phase 2 and Phase 3 outputs
        run: node tests/phase3-regression.cjs
