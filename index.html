function clean(x){return String(x==null?'':x).trim()} function unknown(x){let s=clean(x);return !s||s.includes('不确定')||s.includes('不知道')}
function arr(x){return Array.isArray(x)?x:(x?[x]:[])}
function ageBand(x){x=clean(x).replace(/\s/g,'');if(x.includes('还没有'))return'None';if(x.includes('不到6个月'))return'<6m';if(x.includes('6–11')||x.includes('6-11'))return'6–11m';if(x.includes('1–2')||x.includes('1-2'))return'1–2y';if(x.includes('2年以上'))return'2y+';return'Unknown'}
function scoreBand(x){x=clean(x).replace(/\s/g,'');if(x==='740+')return'740+';if(x.includes('700–739')||x.includes('700-739'))return'700–739';if(x.includes('670–699')||x.includes('670-699'))return'670–699';if(x.includes('670以下'))return'<670';return'Unknown'}
function sev(x){x=clean(x).replace(/\s/g,'');if(unknown(x))return null;if(['0张','1张','0次','1次','0','1'].includes(x))return 0;if(x.includes('2–3')||x.includes('2-3'))return 1;if(x.includes('4–5')||x.includes('4-5'))return 2;if(x.includes('6张以上')||x.includes('6次以上')||x==='6+')return 3;return null}
function activity(a3,a4){const x=sev(a3),y=sev(a4);if(x==null||y==null)return'UNKNOWN';return ['LOW','MEDIUM','HIGH','VERY_HIGH'][Math.max(x,y)]}
function genericAdj(sig,sens){if(sig==='LOW'||sig==='UNKNOWN')return 0;if(sig==='MEDIUM')return sens==='HIGH'?1:0;if(sig==='HIGH')return sens==='LOW'?0:1;if(sig==='VERY_HIGH')return sens==='HIGH'?2:(sens==='MEDIUM'?1:0);return 0}
function rawDown(r,n){if(r==='INSUFFICIENT_DATA')return r;const o=['HIGH','MEDIUM','HIGH_RISK'];let i=o.indexOf(r);return i<0?r:o[Math.min(2,i+n)]}
function baseApproval(age,score){const M={'None':{'740+':'HIGH_RISK','700–739':'HIGH_RISK','670–699':'HIGH_RISK','<670':'HIGH_RISK','Unknown':'INSUFFICIENT_DATA'},'<6m':{'740+':'HIGH_RISK','700–739':'HIGH_RISK','670–699':'HIGH_RISK','<670':'HIGH_RISK','Unknown':'INSUFFICIENT_DATA'},'6–11m':{'740+':'MEDIUM','700–739':'MEDIUM','670–699':'HIGH_RISK','<670':'HIGH_RISK','Unknown':'INSUFFICIENT_DATA'},'1–2y':{'740+':'HIGH','700–739':'MEDIUM','670–699':'MEDIUM','<670':'HIGH_RISK','Unknown':'INSUFFICIENT_DATA'},'2y+':{'740+':'HIGH','700–739':'HIGH','670–699':'MEDIUM','<670':'HIGH_RISK','Unknown':'INSUFFICIENT_DATA'},'Unknown':{'740+':'INSUFFICIENT_DATA','700–739':'INSUFFICIENT_DATA','670–699':'INSUFFICIENT_DATA','<670':'INSUFFICIENT_DATA','Unknown':'INSUFFICIENT_DATA'}};return M[age][score]}

amex_gold:{q5:{title:'你的 AMEX Gold 近期申请和 AMEX 持卡情况',subs:[{id:'Q5A',title:'过去 90 天内，你是否申请过或获批过 AMEX Gold？',options:['没有','有','不确定']},{id:'Q5B',title:'你目前一共持有多少张 AMEX Gold、Platinum、Green 这类卡？',options:['0–4 张','5–7 张','8–9 张','10 张或以上','不确定']}]},q6:{title:'你过去是否持有过以下任一张卡？',multi:'Q6',options:['AMEX Gold','Premier Rewards Gold','AMEX Platinum','AMEX Platinum（Schwab）','AMEX Platinum（Morgan Stanley）','都没有','不确定'],exclusive:['都没有','不确定']}},
amex_platinum:{q5:{title:'这张卡的近期申请和 AMEX 持卡情况',subs:[{id:'Q5A',title:'过去 90 天内，你是否申请过或获批过 AMEX Platinum？',options:['没有','有','不确定']},{id:'Q5B',title:'你目前一共持有多少张 AMEX Gold、Platinum、Green 这类卡？',options:['0–4 张','5–7 张','8–9 张','10 张或以上','不确定']}]},q6:{title:'你过去是否持有过以下任一张个人 Platinum 卡？',multi:'Q6',options:['AMEX Platinum','AMEX Platinum（Schwab）','AMEX Platinum（Morgan Stanley）','都没有','不确定'],exclusive:['都没有','不确定']}},
bilt_palladium:{q5:{title:'你的 Bilt Card 2.0 持卡和开卡奖励历史是什么？',radio:'Q5',options:['从未持有过 Bilt Card 2.0，也没拿过 Bilt Card 2.0 开卡奖励','现在或过去持有过 Bilt Blue / Obsidian / Palladium，但没有拿过开卡奖励','曾经拿过任一张 Bilt Card 2.0 的开卡奖励','不确定']},q6:{title:'你最近一次 Bilt Card 2.0 申请是否被拒？',radio:'Q6',options:['没有被拒','被拒且未满 45 天','被拒且已满 45 天','不确定']}},
capital_one_venture_x:{q5:{title:'你的 Capital One 近期申请情况',subs:[{id:'Q5A',title:'距离你最近一次申请或获批 Capital One 信用卡是否不足 6 个月？',options:['不是','是','不确定']},{id:'Q5B',title:'过去 30 天内，你申请过多少次 Capital One 信用卡？',options:['0 次','1 次','2 次或以上','不确定']}]},q6:{title:'你的 Venture X 奖励资格',subs:[{id:'Q6A',title:'过去 48 个月内，你是否拿到过 Capital One Venture X 的新卡开卡奖励？',options:['没有','有','不确定']}]}},
citi_strata_elite:{q5:{title:'你的 Citi 近期申请情况',subs:[{id:'Q5A',title:'过去 8 天内，你是否申请过 Citi 的个人信用卡？',options:['没有','有','不确定']},{id:'Q5B',title:'过去 65 天内，你一共提交过多少次 Citi 信用卡申请？',options:['0 次','1 次','2 次或以上','不确定']}]},q6:{title:'你的 Citi Strata Elite 奖励和转卡历史',subs:[{id:'Q6A',title:'过去 48 个月内，你是否拿到过 Citi Strata Elite 的新卡开卡奖励？',options:['没有','有','不确定']},{id:'Q6B',title:'你是否曾把其他 Citi 信用卡转换成 Citi Strata Elite？',options:['没有','有','不确定']},{id:'Q6B_FOLLOWUP',title:'被转成 Citi Strata Elite 的那张 Citi 卡，开卡奖励是否在过去 48 个月内拿到？',options:['是','否，已超过 48 个月','当时没有拿过','不确定'],showWhen:{id:'Q6B',value:'有'}}]}}
};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function actionClass(a){return a==='现在申请'?'apply':a==='可以申请'?'consider':a==='建议等待'?'wait':'stop'}
function renderSidebar(){sidebar.innerHTML='<div class="side-title">选择信用卡</div>'+Object.entries(C.cards).map(([k,c])=>`<button class="card-btn ${k===current?'active':''}" data-card="${k}">${esc(c.name)}<small>${esc(c.timing.current)}</small></button>`).join('')+`<div class="side-note">规则快照：${C.snapshotDate}<br>Bank Rules：128 条<br>Full Report Registry：V1<br>离线运行，不调用 GPT。</div>`;sidebar.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{current=b.dataset.card;renderSidebar();renderForm()})}
function radio(name,opts){return`<div class="options">${opts.map(o=>`<label class="option"><input type="radio" name="${esc(name)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`}function multi(name,opts,exclusive=[]){return`<div class="options">${opts.map(o=>`<label class="option ${o.length>28?'long':''}"><input type="checkbox" data-multi="${esc(name)}" data-exclusive="${exclusive.includes(o)?'1':'0'}" name="${esc(name)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`}function common(q){return`<div class="question"><div class="qnum">${q.n}</div><div class="qtitle">${esc(q.title)}</div>${radio(q.id,q.options)}</div>`}function spec(n,b){let body='';if(b.radio)body=radio('sp_'+b.radio,b.options);else if(b.multi)body=multi('sp_'+b.multi,b.options,b.exclusive||[]);else body=b.subs.map(s=>`<div class="subq ${s.showWhen?'hidden':''}" data-subq="${s.id}" ${s.showWhen?`data-show-id="${s.showWhen.id}" data-show-value="${esc(s.showWhen.value)}"`:''}><div class="subq-title">${esc(s.title)}</div>${radio('sp_'+s.id,s.options)}${s.numberWhen?`<div class="number-row hidden" data-number-for="${s.id}"><input type="number" min="0" max="99" step="1" name="sp_${s.numberId}" placeholder="0"><span>${esc(s.numberLabel)}</span></div>`:''}</div>`).join('');return`<div class="question"><div class="qnum">Q${n}</div><div class="qtitle">${esc(b.title)}</div>${body}</div>`}function benefits(n,title,bs,name){return`<div class="question"><div class="qnum">Q${n}</div><div class="qtitle">${esc(title)}</div>${multi(name,bs.map(x=>x.label).concat(['以上基本都用不到']),['以上基本都用不到'])}</div>`}
function renderForm(){const c=C.cards[current],s=SPEC[current];main.innerHTML=`<div class="hero"><div class="eyebrow">Assessment · ${C.engineVersion}</div><h2>${esc(c.name)}</h2><div class="hero-meta"><span class="offer-chip">当前 Offer：${esc(c.timing.current)}</span><span class="offer-chip">奖励评级：${esc(c.timing.rating)}</span><span class="offer-chip">规则日期：${C.snapshotDate}</span></div></div><form id="form"><div class="sections"><section class="section"><div class="section-title">基础情况</div><div class="section-sub">A1–A4 只用于固定的 Approval Engine；不知道也可以继续生成报告。</div>${COMMON.map(common).join('')}</section><section class="section"><div class="section-title">申请与奖励规则</div><div class="section-sub">不确定或暂时不知道也可以继续；完整报告会明确标出无法判断的部分。</div>${spec(5,s.q5)}${spec(6,s.q6)}</section><section class="section"><div class="section-title">长期持有价值</div><div class="section-sub">勾选你预计长期确实能用到的福利。</div>${benefits(7,'下面哪些有明确金额的福利/报销你预计能实际用到？',c.q7,'q7')}${benefits(8,'除上述可量化福利外，下面哪些长期福利对你有实际价值？',c.q8,'q8')}</section><div class="form-error" id="formError"></div><div class="actions"><button type="button" class="btn secondary" id="clearBtn">清空</button><button type="submit" class="btn primary">生成完整分析</button></div></div></form>`;wire();restoreCommon()}
function wire(){document.querySelectorAll('input[type=checkbox][data-multi]').forEach(x=>x.addEventListener('change',()=>{const peers=[...document.querySelectorAll(`input[data-multi="${CSS.escape(x.dataset.multi)}"]`)];if(x.checked&&x.dataset.exclusive==='1')peers.filter(p=>p!==x).forEach(p=>p.checked=false);else if(x.checked)peers.filter(p=>p.dataset.exclusive==='1').forEach(p=>p.checked=false)}));document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',()=>{if(x.name==='sp_Q5B'&&current==='chase_sapphire_preferred'){const r=document.querySelector('[data-number-for="Q5B"]');if(r)r.classList.toggle('hidden',x.value!=='有')}document.querySelectorAll('[data-show-id]').forEach(el=>{const ch=document.querySelector(`input[name="sp_${CSS.escape(el.dataset.showId)}"]:checked`);el.classList.toggle('hidden',!(ch&&ch.value===el.dataset.showValue))});if(['a1','a2','a3','a4'].includes(x.name))saveCommon()}));document.getElementById('clearBtn').onclick=()=>{document.getElementById('form').reset();localStorage.removeItem('nb_assessment_common');document.querySelectorAll('[data-number-for]').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('[data-show-id]').forEach(x=>x.classList.add('hidden'))};document.getElementById('form').onsubmit=e=>{e.preventDefault();submit()}}
function saveCommon(){let o={};COMMON.forEach(q=>{let x=document.querySelector(`input[name="${q.id}"]:checked`);if(x)o[q.id]=x.value});try{localStorage.setItem('nb_assessment_common',JSON.stringify(o))}catch(e){}}function restoreCommon(){try{let o=JSON.parse(localStorage.getItem('nb_assessment_common')||'{}');Object.entries(o).forEach(([k,v])=>{let x=[...document.querySelectorAll(`input[name="${k}"]`)].find(i=>i.value===v);if(x)x.checked=true})}catch(e){}}function checked(name){let x=document.querySelector(`input[name="${CSS.escape(name)}"]:checked`);return x?x.value:null}function checkedM(name){return[...document.querySelectorAll(`input[name="${CSS.escape(name)}"]:checked`)].map(x=>x.value)}
function read(){const a={specific:{},q7:[],q8:[]};COMMON.forEach(q=>{a[q.id]=checked(q.id)});for(const [num,b] of [[5,SPEC[current].q5],[6,SPEC[current].q6]]){if(b.radio){a.specific[b.radio]=checked('sp_'+b.radio)}else if(b.multi){a.specific[b.multi]=checkedM('sp_'+b.multi)}else for(const s of b.subs){if(s.showWhen){let pv=a.specific[s.showWhen.id]||checked('sp_'+s.showWhen.id);if(pv!==s.showWhen.value)continue}let v=checked('sp_'+s.id);a.specific[s.id]=v;if(s.numberWhen&&v===s.numberWhen){let el=document.querySelector(`input[name="sp_${s.numberId}"]`);a.specific[s.numberId]=el?el.value:''}}}let q7=checkedM('q7'),q8=checkedM('q8');a.q7Answered=q7.length>0;a.q8Answered=q8.length>0;a.q7=q7.includes('以上基本都用不到')?[]:C.cards[current].q7.filter(b=>q7.includes(b.label)).map(b=>b.id);a.q8=q8.includes('以上基本都用不到')?[]:C.cards[current].q8.filter(b=>q8.includes(b.label)).map(b=>b.id);return{a,miss:[]}}
function submit(){let{a}=read(),err=document.getElementById('formError');err.classList.remove('show');saveCommon();let r=E.evaluate(current,a);r.assessmentDate=new Date().toLocaleDateString('sv-SE');last[current]=r;try{localStorage.setItem('nb_last_'+current,JSON.stringify({answers:a,result:r}))}catch(e){}renderReport(r)}
function section(title,status,text){return`<section class="report-section"><div class="report-title">${esc(title)}${status?`<span class="status">${esc(status)}</span>`:''}</div><div class="report-text">${esc(text)}</div></section>`}
function renderReport(r){const o=r.output,c=r.card,rep=r.report,ct=rep.cta;main.innerHTML=`<div class="report"><div class="report-head"><div class="report-kicker">${esc(c.name)} · 评估日期 ${esc(r.assessmentDate)}</div><div class="action-label ${actionClass(o.recommendedAction)}">${esc(o.recommendedAction)}</div><div class="summary">${esc(o.summary)}</div></div>${section('申请规则','',rep.applicationText)}${section('开卡奖励资格',o.bonusLabel,rep.bonusText)}${section('当前开卡奖励',o.offerRating,rep.offerText).replace('</section>', '<div class="offer-history-chart" id="offerHistoryChart"></div></section>')}${section('获批可能性',o.approvalLabel,rep.approvalText)}${section('长期持有价值',o.longTermLabel,rep.longText)}<div class="cta-box"><div class="report-title">下一步</div><p>${esc(ct.pre)}</p><div class="cta-actions"><button class="btn primary" id="prodCta">${esc(ct.text)}</button></div></div><div class="dev-tools"><button class="btn secondary" id="editBtn">修改答案</button><button class="btn secondary" id="offerBtn">返回 Offer</button><button class="btn ghost" id="copyBtn">复制结果 JSON</button></div><details class="debug"><summary>开发调试信息（内部）</summary><div class="debug-box">${debug(r)}</div></details></div>`;if(window.OfferHistoryChart)window.OfferHistoryChart.mount(document.getElementById('offerHistoryChart'),c.timing.timingId,r.assessmentDate);document.getElementById('prodCta').onclick=()=>{if(ct.dest==='current_application_url')window.open(c.applicationUrl,'_blank','noopener');else renderOffer(r)};document.getElementById('editBtn').onclick=renderForm;document.getElementById('offerBtn').onclick=()=>renderOffer(r);document.getElementById('copyBtn').onclick=async()=>{let t=JSON.stringify(r,null,2);try{await navigator.clipboard.writeText(t);document.getElementById('copyBtn').textContent='已复制'}catch(e){prompt('复制下面内容：',t)}};window.scrollTo({top:0,behavior:'smooth'})}
function renderOffer(r){const o=r.output,c=r.card;main.innerHTML=`<div class="offer-page"><div class="offer-top"><div class="eyebrow">模拟 Offer Detail</div><h2>${esc(c.name)}</h2><div class="hero-meta"><span class="offer-chip">${esc(c.timing.current)}</span><span class="offer-chip">年费 $${esc(c.annualFee)}</span></div></div><div class="assessment-card"><h3>你的评估</h3><div class="assessment-action ${actionClass(o.recommendedAction)}">${esc(o.recommendedAction)}</div><div class="metrics"><div class="metric"><div class="metric-name">开卡奖励评级</div><div class="metric-value">${esc(o.offerRating)}</div></div><div class="metric"><div class="metric-name">获批可能性</div><div class="metric-value">${esc(o.approvalLabel)}</div></div><div class="metric"><div class="metric-name">能否拿奖励</div><div class="metric-value">${esc(o.bonusLabel)}</div></div><div class="metric"><div class="metric-name">长期持有价值</div><div class="metric-value">${esc(o.longTermLabel)}</div></div></div><div class="assessment-date">Assessment 日期：${esc(r.assessmentDate)}</div><div class="offer-actions"><button class="btn primary" id="fullBtn">查看完整分析</button><button class="btn secondary" id="redoBtn">重新评估</button>${['APPLY_NOW','CONSIDER'].includes(o.internalState)?'<button class="btn secondary" id="applyBtn">去申请</button>':''}</div></div></div>`;document.getElementById('fullBtn').onclick=()=>renderReport(r);document.getElementById('redoBtn').onclick=renderForm;let a=document.getElementById('applyBtn');if(a)a.onclick=()=>window.open(c.applicationUrl,'_blank','noopener');window.scrollTo({top:0,behavior:'smooth'})}
function renderIncomplete(r){renderReport(r)}
function debug(r){return esc(`Engine: ${C.engineVersion}\nSnapshot: ${C.snapshotDate}\nTriggered Rules: ${r.bank.triggeredRules.join(', ')||'NONE'}\nApplication Impact: ${r.bank.applicationImpact}\nApplication Soft Impact: ${r.bank.applicationSoftImpact}\nApplication Hard: ${r.bank.applicationHardBehavior}\nBonus Impact: ${r.bank.bonusImpact}\nBonus Hard: ${r.bank.bonusHardBehavior}\nMissing User Facts: ${(r.bank.missingUserFacts||[]).join(', ')||'NONE'}\nBase Approval: ${r.approval.baseApproval}\nApproval After Soft: ${r.output.approvalAfterSoftRules}\nAdjusted Approval: ${r.output.adjustedApproval}\nOffer Rating: ${r.output.offerRating}\nBonus Status: ${r.output.bonusStatus}\nLong-term: ${r.longTerm.code}\nInternal State: ${r.output.internalState}\nRecommended Action: ${r.output.recommendedAction}`)}
renderSidebar();renderForm();
})();
</script></body></html>
