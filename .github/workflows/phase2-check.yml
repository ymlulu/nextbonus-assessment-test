name: Phase 2 Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/data-driven-assessment-phase2]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime contracts
        run: python scripts/validate_phase2_runtime.py .
      - name: Compare Phase 1 and Phase 2 outputs
        run: node tests/phase2-regression.cjs
